name: Compila APK

on:
  push:
    branches: [main]
    paths-ignore: ["estensione/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compila
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TraduttoreFumetti-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # Copia l'APK anche nel ramo "apk", così si può scaricare con git
      - name: Pubblica nel ramo apk
        run: |
          mkdir /tmp/out && cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/
          cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # GitHub accetta file fino a 100 MB: se serve divido l'APK in pezzi
          split -b 90m app-debug.apk app-debug.apk.part- && rm app-debug.apk
          git add .
          git commit -qm "APK da ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
